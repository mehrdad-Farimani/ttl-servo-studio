name: Build desktop apps
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install . pyinstaller==6.19.0
      - run: python -m unittest discover -s tests
      - run: python -m PyInstaller --noconfirm --windowed --name TTL-Servo-Studio --collect-data ttl_servo_studio --add-data "LICENSE:." --add-data "THIRD_PARTY_NOTICES.md:." run.py
      - uses: actions/upload-artifact@v4
        with:
          name: TTL-Servo-Studio-${{ matrix.os }}
          path: dist/
